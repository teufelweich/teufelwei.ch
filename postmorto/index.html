<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>postmorto</title>
<meta name="apple-mobile-web-app-title" content="postmorto">
<meta property="og:title" content="postmorto">
<style>
  :root{
    /* Screen (LCD) position as a fraction of the cam.png image, calibrated
       to the supplied camera photo. If you swap in a different cam.png,
       re-measure these four numbers (0-1) against your image. */
    --screen-left: 0.152;
    --screen-top: 0.48;
    --screen-width: 0.473;
    --screen-height: 0.426;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background:#000; overflow:hidden;
    touch-action: manipulation;
    -webkit-user-select:none; user-select:none;
  }

  #app{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }

  #stage{
    position:relative;
    /* width/height set by JS to fit viewport while keeping cam.png ratio */
  }

  #camImg{
    display:block;
    width:100%; height:100%;
    -webkit-user-drag:none;
    pointer-events:none;
  }

  #screen{
    position:absolute;
    left:   calc(var(--screen-left)   * 100%);
    top:    calc(var(--screen-top)    * 100%);
    width:  calc(var(--screen-width)  * 100%);
    height: calc(var(--screen-height) * 100%);
    overflow:hidden;
    background:#050505;
    cursor:pointer;
  }

  #photo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:none;
  }
  #photo.active{ display:block; }

  #counter{
    position:absolute;
    right:3%; bottom:2%;
    font: 500 2.3vh/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color:rgba(255,255,255,0.55);
    text-shadow:0 0 3px rgba(0,0,0,0.9);
    pointer-events:none;
    letter-spacing:0.5px;
  }

  #message{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:6%;
    color:#ccc;
    font: 400 2vh/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #rotate{
    --mono: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    position:fixed; inset:0; z-index:10;
    display:none;
    flex-direction:column;
    align-items:flex-start; justify-content:flex-start;
    background:#000; color:#c9c2ab;
    text-align:left;
    padding:9vh 8vw 4vh;
    font-family: var(--mono);
    overflow:hidden;
  }

  #rotate .title{
    margin:0 0 4vh 0;
    font-family: var(--mono);
    font-weight:700;
    font-size:8.5vw;
    letter-spacing:0.12em;
    text-transform:lowercase;
    color:#e8dcae;
    text-shadow:0 0 14px rgba(232,220,174,0.35);
  }

  #rotate .body-text{
    flex:0 0 auto;
    max-width:100%;
    font-size:4.3vw;
    line-height:1.6;
    text-align:left;
    white-space:pre-wrap;
    color:#c9c2ab;
  }

  #rotate .cursor{
    display:inline-block;
    width:0.55em; height:1em;
    background:#c9c2ab;
    vertical-align:text-bottom;
    margin-left:1px;
    animation:blink 1s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  #rotate .icon-wrap{
    align-self:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    margin-top:5vh;
    opacity:0;
    transition:opacity 1s ease;
  }
  #rotate .icon-wrap.visible{ opacity:1; }

  #rotate .rotate-caption{
    margin:0 0 2.5vh 0;
    font-family: var(--mono);
    font-size:3.6vw;
    letter-spacing:0.05em;
    color:#c9c2ab;
  }

  #rotate .phone-icon{
    color:#e8dcae;
    animation:rotateHint 3.2s ease-in-out infinite;
    transform-origin:50% 50%;
  }
  @keyframes rotateHint{
    0%, 12%   { transform:rotate(0deg); }
    45%, 62%  { transform:rotate(-90deg); }
    92%, 100% { transform:rotate(0deg); }
  }

  #rotate .credits{
    margin-top:auto;
    padding-top:4vh;
    font-family: var(--mono);
    font-size:2.6vw;
    letter-spacing:0.08em;
    color:#5f5a49;
  }

  @media (orientation: portrait){
    #rotate{ display:flex; }
    #app{ display:none; }
  }
</style>
</head>
<body>

  <div id="rotate">
    <h1 class="title">postmorto</h1>
    <p class="body-text" id="storyText"><span class="cursor"></span></p>
    <div class="icon-wrap" id="iconWrap">
      <p class="rotate-caption">rotate the phone to discover</p>
      <svg class="phone-icon" width="46" height="76" viewBox="0 0 60 100" aria-hidden="true">
        <rect x="6" y="6" width="48" height="88" rx="8" ry="8" fill="none" stroke="currentColor" stroke-width="5"/>
        <line x1="24" y1="86" x2="36" y2="86" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="credits">by asia, milena, jj, marius</div>
  </div>

  <div id="app">
    <div id="stage">
      <img id="camImg" src="cam.png" alt="camera" draggable="false">
      <div id="screen">
        <img id="photo" alt="photo">
        <div id="message"></div>
        <div id="counter"></div>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var stage   = document.getElementById('stage');
  var camImg  = document.getElementById('camImg');
  var screenEl= document.getElementById('screen');
  var photoEl = document.getElementById('photo');
  var counter = document.getElementById('counter');
  var message = document.getElementById('message');

  var images = [];      // resolved image paths, in numeric order
  var index  = -1;       // current index into images[]

  // ---------- Stage sizing: fit viewport while keeping cam.png's ratio ----------
  var camRatio = 4 / 3; // fallback until the real image reports its size

  function layout(){
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var targetRatio = camRatio;
    var w = vw, h = vw / targetRatio;
    if (h > vh){ h = vh; w = vh * targetRatio; }
    stage.style.width  = w + 'px';
    stage.style.height = h + 'px';
  }

  camImg.addEventListener('load', function(){
    if (camImg.naturalWidth && camImg.naturalHeight){
      camRatio = camImg.naturalWidth / camImg.naturalHeight;
    }
    layout();
  });
  if (camImg.complete && camImg.naturalWidth) {
    camRatio = camImg.naturalWidth / camImg.naturalHeight;
    layout();
  }

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 50); });

  // Best-effort landscape lock (works only inside fullscreen on browsers
  // that support the Screen Orientation API; silently ignored otherwise).
  document.addEventListener('click', function tryLock(){
    document.removeEventListener('click', tryLock);
    try{
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req){
        req.call(el).then(function(){
          if (screen.orientation && screen.orientation.lock){
            screen.orientation.lock('landscape').catch(function(){});
          }
        }).catch(function(){});
      }
    }catch(e){}
  }, { once:true });

  // ---------- Discover images: img/1.jpg, img/2.jpg, ... until one 404s ----------
  function probe(n){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload  = function(){ resolve(true); };
      img.onerror = function(){ resolve(false); };
      img.src = 'img/' + n + '.jpg';
    });
  }

  function discover(){
    var n = 1;
    function step(){
      return probe(n).then(function(ok){
        if (ok){
          images.push('img/' + n + '.jpg');
          n++;
          return step();
        }
      });
    }
    return step();
  }

  function showMessage(text){
    message.textContent = text;
    message.style.display = 'flex';
    photoEl.classList.remove('active');
    counter.textContent = '';
  }

  function render(){
    if (!images.length){
      showMessage('No images found in ./img');
      return;
    }
    message.style.display = 'none';
    photoEl.src = images[index];
    photoEl.classList.add('active');
    counter.textContent = (index + 1) + ' / ' + images.length;
  }

  function goTo(newIndex){
    if (newIndex < 0 || newIndex >= images.length) return; // no wrap-around
    index = newIndex;
    render();
  }

  screenEl.addEventListener('click', function(e){
    if (!images.length) return;
    var rect = screenEl.getBoundingClientRect();
    var x = e.clientX - rect.left;
    if (x < rect.width / 2){
      goTo(index - 1);
    } else {
      goTo(index + 1);
    }
  });

  // ---------- Typewriter intro text (portrait screen) ----------
  (function typewriter(){
    var el = document.getElementById('storyText');
    var iconWrap = document.getElementById('iconWrap');
    var story = "it's been a long, strenuous day of hiking through the wasteland, "
              + "but now you've luckily found a little refuge for the night.\n\n"
              + "upon closer inspection you feel that something is weird about this place.\n\n"
              + "you've found a camera and it seems to still be working…";
             // + "rotate your phone to start.";

    var i = 0;
    var speed = 32; // ms per character

    function tick(){
      if (i <= story.length){
        el.textContent = story.slice(0, i);
        var cursor = document.createElement('span');
        cursor.className = 'cursor';
        el.appendChild(cursor);
        i++;
        setTimeout(tick, speed);
      } else {
        iconWrap.classList.add('visible');
      }
    }
    tick();
  })();

  showMessage('Loading…');
  discover().then(function(){
    if (images.length){
      index = 0;
      render();
    } else {
      showMessage('No images found in ./img');
    }
  });

})();
</script>
</body>
</html>
